# Builds ParetoTimer.app on every push and pull request.
# Publishes ParetoTimer.zip as a GitHub release when you either:
#   - run the workflow from the Actions tab with a version, like 1.1.0, or
#   - push a tag like v1.1.0.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, like 1.1.0. Leave blank to build only."
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "Version must look like 1.1.0, got: $INPUT_VERSION"
              exit 1
            fi
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: bash build.sh --no-install

      - name: Check the bundle
        run: |
          plutil -lint ParetoTimer.app/Contents/Info.plist
          lipo ParetoTimer.app/Contents/MacOS/ParetoTimer -verify_arch arm64 x86_64
          codesign --verify --verbose ParetoTimer.app

      - name: Zip
        run: ditto -c -k --keepParent ParetoTimer.app ParetoTimer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ParetoTimer-${{ env.VERSION }}
          path: ParetoTimer.zip

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" ParetoTimer.zip --target "$GITHUB_SHA" \
            --title "Pareto Timer $RELEASE_TAG" --generate-notes
