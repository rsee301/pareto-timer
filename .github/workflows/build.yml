# Builds ParetoTimer.app on every push and pull request.
# A tag like v1.0.0 also publishes ParetoTimer.zip as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: bash build.sh --no-install

      - name: Check the bundle
        run: |
          plutil -lint ParetoTimer.app/Contents/Info.plist
          lipo ParetoTimer.app/Contents/MacOS/ParetoTimer -verify_arch arm64 x86_64
          codesign --verify --verbose ParetoTimer.app

      - name: Zip
        run: ditto -c -k --keepParent ParetoTimer.app ParetoTimer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ParetoTimer-${{ env.VERSION }}
          path: ParetoTimer.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ParetoTimer.zip \
            --title "Pareto Timer $GITHUB_REF_NAME" --generate-notes
